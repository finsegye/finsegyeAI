<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0f"><title>핀세계 매장 광고 확인</title><style>
*{box-sizing:border-box}body{margin:0;background:#07090d;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.page{width:min(100%,640px);min-height:100vh;margin:auto;background:radial-gradient(circle at 80% 5%,#594010 0,#111722 35%,#07090d 70%);padding-bottom:30px}.top{padding:18px 18px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;color:#ffd76a;letter-spacing:.06em}.demo{font-size:11px;background:#422e00;color:#ffe5a1;border:1px solid #9b7119;padding:6px 9px;border-radius:999px}.hero{position:relative;margin:8px 14px;border-radius:22px;overflow:hidden;background:#111827;min-height:250px;box-shadow:0 20px 50px #0009;border:1px solid #3a3220}.hero img,.hero video{display:block;width:100%;max-height:58vh;object-fit:cover;background:#000}.placeholder{min-height:270px;display:grid;place-items:center;text-align:center;padding:30px;background:linear-gradient(135deg,#1d2b3e,#5a3d07);font-size:64px}.card{padding:22px 20px}.store{color:#ffd76a;font-weight:900;font-size:17px}.title{font-size:29px;line-height:1.25;margin:9px 0 13px;font-weight:950;word-break:keep-all}.benefit{font-size:17px;line-height:1.65;color:#eef1f5;white-space:pre-wrap}.meta{margin-top:17px;padding:14px;border-radius:14px;background:#ffffff0d;border:1px solid #ffffff1c;color:#cbd0d8;line-height:1.7}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;border:0;border-radius:14px;padding:15px 10px;font-weight:900;font-size:15px}.call{background:#ffd15a;color:#171009}.map{background:#273143;color:#fff}.approve{width:100%;margin-top:11px;background:#20ad68;color:#fff}.footer{text-align:center;padding:20px 10px;color:#818a99;font-size:12px}.error{padding:80px 24px;text-align:center;line-height:1.7}.share-note{font-size:12px;color:#9da7b6;margin-top:10px;text-align:center}@media(max-width:390px){.title{font-size:25px}.actions{grid-template-columns:1fr}.hero{min-height:220px}}
</style></head><body><main id="app" class="page"><div class="error">광고를 불러오고 있습니다…</div></main><script>
(function(){
  const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const params=new URLSearchParams(location.search),src=params.get('src'),legacy=params.get('campaign'),app=document.getElementById('app');
  const fail=e=>{app.innerHTML='<div class="error"><h2>광고를 열지 못했습니다.</h2><p>'+esc(e.message||e)+'</p><p>새 QR을 다시 생성해 주세요.</p></div>';};
  const decodeInline=()=>{const raw=location.hash.startsWith('#data=')?location.hash.slice(6):'';if(!raw)return null;const normalized=raw.replace(/-/g,'+').replace(/_/g,'/');const binary=atob(normalized+'='.repeat((4-normalized.length%4)%4));return JSON.parse(new TextDecoder().decode(Uint8Array.from(binary,c=>c.charCodeAt(0))));};
  const render=d=>{
    if(!d||!d.store)throw new Error('광고 내용이 없습니다.');
    const media=d.videoUrl?`<video controls playsinline preload="metadata" poster="${esc(d.photoUrl)}"><source src="${esc(d.videoUrl)}" type="video/mp4"></video>`:(d.photoUrl?`<img src="${esc(d.photoUrl)}" alt="${esc(d.store)} 광고 사진">`:'<div class="placeholder">✨<br><small>우리 동네 특별 혜택</small></div>');
    const tel=String(d.phone||'').replace(/[^0-9+]/g,''),map='https://map.kakao.com/link/search/'+encodeURIComponent(d.address||d.store||'');
    app.innerHTML=`<header class="top"><div class="brand">FINSEGYE · 핀세계</div><div class="demo">${esc(d.badge||'현장 시연')}</div></header><section class="hero">${media}</section><section class="card"><div class="store">${esc(d.store)}</div><h1 class="title">${esc(d.title)}</h1><div class="benefit">${esc(d.benefit)}</div><div class="meta">${d.address?'📍 '+esc(d.address)+'<br>':''}${d.phone?'☎ '+esc(d.phone):''}</div><div class="actions">${tel?`<a class="btn call" href="tel:${tel}">전화하기</a>`:''}<a class="btn map" href="${map}" target="_blank" rel="noopener">지도 보기</a></div><button id="approve" class="btn approve" type="button">✓ 이 광고 시안 승인</button><div class="share-note">승인 버튼은 사장님의 공유 화면을 열며 실제 광고를 발송하지 않습니다.</div></section><footer class="footer">지역 광고 기술 제공 · 핀세계<br>본 화면은 매장 확인용 광고 시안입니다.</footer>`;
    document.getElementById('approve').onclick=async()=>{const data={title:'핀세계 광고 시안 승인',text:`${d.store} 광고 시안을 승인합니다.\n광고번호: ${d.id}`,url:location.href};if(navigator.share){try{await navigator.share(data);return}catch(_){}}try{await navigator.clipboard.writeText(data.text+'\n'+data.url);alert('승인 문구와 광고 주소를 복사했습니다.')}catch(_){alert('광고번호 '+d.id+' 시안을 승인합니다.')}};
  };
  try{
    const inline=decodeInline();if(inline){render(inline);return;}
    if(src){window.__FINSEGYE_CAMPAIGN__=null;const script=document.createElement('script');script.src=src;script.onload=()=>{try{render(window.__FINSEGYE_CAMPAIGN__)}catch(e){fail(e)}};script.onerror=()=>fail(new Error('동영상 광고 정보를 불러오지 못했습니다.'));document.head.appendChild(script);return;}
    if(legacy){fetch(legacy,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('광고 데이터를 찾지 못했습니다.');return r.json()}).then(render).catch(fail);return;}
    throw new Error('광고 주소가 없습니다.');
  }catch(e){fail(e);}
})();
</script></body></html>
